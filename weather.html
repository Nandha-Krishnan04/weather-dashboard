
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="dashboard">
        <h1>Weather Dashboard 🌤️</h1>
        <p>Check the weather in your city</p>

        <form id="search-form">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="status" role="status">Search for a city to begin.</p>

        <section id="weather-card" hidden>
            <h2 id="city-name"></h2>
            <p id="condition"></p>
            <h3 id="temperature"></h3>

            <div class="details">
                <p>Feels like: <span id="feels-like">--</span></p>
                <p>Humidity: <span id="humidity">--</span></p>
                <p>Wind speed: <span id="wind">--</span></p>
            </div>
        </section>
    </main>
</body>
</html>
